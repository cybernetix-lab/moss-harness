name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Run health check
      run: |
        chmod +x scripts/*.sh
        ./tooling/scripts/health-check.sh

  validate-configs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install yamllint
      run: |
        sudo apt-get update
        sudo apt-get install -y yamllint

    - name: Validate YAML files
      run: |
        find . -name "*.yaml" -o -name "*.yml" | grep -v node_modules | grep -v deployments/helm/templates | xargs yamllint -d relaxed

    - name: Validate skill definitions
      run: |
        for skill in integrations/skills/*/skill.yaml; do
          if [ -f "$skill" ]; then
            echo "Validating $skill"
            yamllint -d relaxed "$skill"
          fi
        done

    - name: Validate agent definitions
      run: |
        for agent in configs/agents/*.yaml; do
          if [ -f "$agent" ]; then
            echo "Validating $agent"
            yamllint -d relaxed "$agent"
          fi
        done

  shellcheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install shellcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Run shellcheck
      run: |
        find . -name "*.sh" | grep -v node_modules | xargs shellcheck --severity=warning || true

  bats-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bats yamllint

    - name: Make scripts executable
      run: |
        chmod +x apps/agent-cli/*.sh
        chmod +x scripts/*.sh
        chmod +x tooling/scripts/*.sh

    - name: Run Bats tests
      run: |
        bats tests/

  test-scripts:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y yamllint

    - name: Make scripts executable
      run: |
        chmod +x apps/agent-cli/*.sh
        chmod +x scripts/*.sh
        chmod +x tooling/scripts/*.sh

    - name: Test skill list
      run: |
        ./tooling/scripts/skill-list.sh

    - name: Test Agent list
      run: |
        ./apps/agent-cli/agent-list.sh

    - name: Test health check
      run: |
        ./tooling/scripts/health-check.sh

    - name: Test verify script (help only)
      run: |
        ./tooling/scripts/verify.sh --help > /dev/null 2>&1 || true
