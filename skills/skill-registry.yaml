# 技能注册表 - 多标签分类系统
# 所有技能在此注册，不再依赖目录结构

registry:
  # 技能发现配置
  discovery:
    # 技能文件匹配模式
    pattern: "**/skill.yaml"
    # 扫描路径（相对于项目根目录）
    paths:
      - "skills/"
    # 排除路径
    exclude:
      - "**/evolution/**"
      - "**/deprecated/**"
  
  # 标签分类体系
  taxonomy:
    # 领域标签 (Domain)
    domain:
      - frontend      # 前端开发
      - backend       # 后端开发
      - fullstack     # 全栈开发
      - mobile        # 移动端
      - devops        # 运维/DevOps
      - ai-ml         # AI/机器学习
      - data          # 数据处理
      - security      # 安全
    
    # 技术栈标签 (Technology)
    technology:
      - react
      - vue
      - angular
      - typescript
      - javascript
      - python
      - go
      - rust
      - java
      - nodejs
      - docker
      - kubernetes
      - aws
      - gcp
      - azure
    
    # 任务类型标签 (Task Type)
    task_type:
      - coding        # 编码/开发
      - review        # 代码审查
      - testing       # 测试
      - debugging     # 调试
      - refactoring   # 重构
      - documentation # 文档
      - research      # 研究
      - analysis      # 分析
      - optimization  # 优化
    
    # 场景标签 (Scenario)
    scenario:
      - startup       # 初创项目
      - enterprise    # 企业级
      - legacy        # 遗留系统
      - greenfield    # 全新项目
      - maintenance   # 维护模式
    
    # 复杂度标签 (Complexity)
    complexity:
      - beginner      # 初级
      - intermediate  # 中级
      - advanced      # 高级
      - expert        # 专家级
  
  # 标签关系定义
  relationships:
    # 标签层级关系
    hierarchy:
      javascript:
        parent: frontend
      typescript:
        parent: frontend
      react:
        parent: [frontend, javascript]
      vue:
        parent: [frontend, javascript]
    
    # 标签互斥关系
    mutually_exclusive:
      - [react, vue, angular]  # 同一项目通常不会同时使用
    
    # 标签推荐关系
    recommendations:
      react:
        suggests: [typescript, frontend, coding]
      security:
        suggests: [review, analysis, testing]

# 已注册技能列表（自动生成，请勿手动编辑）
skills: []
