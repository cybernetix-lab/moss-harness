name: react-hooks
description: |
  React Hooks 开发技能。提供自定义 Hook 生成、性能优化、状态管理等服务。

version: 1.0.0

# 多标签分类（替代原有的单 category）
tags:
  # 领域标签
  - frontend
  # 技术栈标签
  - react
  - typescript
  - javascript
  # 任务类型标签
  - coding
  # 场景标签
  - greenfield
  - maintenance
  # 复杂度标签
  - intermediate

# 标签权重（用于匹配优先级）
tag_weights:
  react: 1.0
  frontend: 0.8
  coding: 0.9

triggers:
  - pattern: "创建.*hook"
    confidence: 0.9
    tags_match: [react, frontend]
  - pattern: "自定义.*hook"
    confidence: 0.9
    tags_match: [react]
  - pattern: "use[A-Z].*"
    confidence: 0.85
    tags_match: [react]
  - pattern: "react.*state.*management"
    confidence: 0.8
    tags_match: [react, frontend]

context:
  required_files:
    - "package.json"
  check_dependencies:
    - react
  preferred_models:
    - claude-3-5-sonnet

patterns:
  - name: async-data-hook
    description: 异步数据获取 Hook
    tags: [data-fetching, async]
    template: |
      function useAsyncData<T>(fetcher: () => Promise<T>) {
        const [data, setData] = useState<T | null>(null);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState<Error | null>(null);
        
        useEffect(() => {
          setLoading(true);
          fetcher()
            .then(setData)
            .catch(setError)
            .finally(() => setLoading(false));
        }, [fetcher]);
        
        return { data, loading, error };
      }
  
  - name: local-storage-hook
    description: LocalStorage 同步 Hook
    tags: [storage, browser-api]
    template: |
      function useLocalStorage<T>(key: string, initialValue: T) {
        const [value, setValue] = useState<T>(() => {
          const stored = localStorage.getItem(key);
          return stored ? JSON.parse(stored) : initialValue;
        });
        
        useEffect(() => {
          localStorage.setItem(key, JSON.stringify(value));
        }, [key, value]);
        
        return [value, setValue] as const;
      }
  
  - name: debounce-hook
    description: 防抖 Hook
    tags: [performance, utility]
    template: |
      function useDebounce<T>(value: T, delay: number): T {
        const [debounced, setDebounced] = useState(value);
        
        useEffect(() => {
          const timer = setTimeout(() => setDebounced(value), delay);
          return () => clearTimeout(timer);
        }, [value, delay]);
        
        return debounced;
      }

rules:
  - name: hook-naming
    pattern: "^use[A-Z][a-zA-Z0-9]*$"
    description: Hook 必须以 use 开头，后跟大写字母
  
  - name: hook-dependency
    description: useEffect 必须包含所有依赖
    check: exhaustive-deps
  
  - name: hook-purity
    description: Hook 应该是纯函数，避免副作用

validation:
  - eslint-plugin-react-hooks
  - typecheck
  - runtime-tests

# 技能关联（相关技能推荐）
related_skills:
  - typescript-patterns
  - react-performance
  - state-management

# 进化配置
evolution:
  track_patterns: true
  learn_from_usage: true
  auto_expand_templates: true
