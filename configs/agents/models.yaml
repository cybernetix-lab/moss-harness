# 模型配置文件
# 与 Agent 配置分离，便于在不同环境中使用不同的模型设置

# 默认模型配置
defaults:
  provider: anthropic
  temperature: 0.2
  max_tokens: 4096

# Agent 模型映射
# 定义每个 Agent 类型使用的模型 profile
agent_models:
  planner:
    profile: high-capability
  reviewer:
    profile: high-capability
  executor:
    profile: balanced
  evaluator:
    profile: high-capability
  orchestrator:
    profile: balanced
  researcher:
    profile: high-capability

# 模型 Profile 定义
profiles:
  # 高能力模型 - 用于复杂推理任务
  high-capability:
    provider: anthropic
    model: claude-3-opus
    temperature: 0.2
    max_tokens: 8192
    description: 用于需要深度推理的复杂任务

  # 平衡模型 - 用于一般任务
  balanced:
    provider: anthropic
    model: claude-3-5-sonnet
    temperature: 0.2
    max_tokens: 4096
    description: 用于大多数常规任务

  # 快速模型 - 用于简单任务
  fast:
    provider: anthropic
    model: claude-3-haiku
    temperature: 0.3
    max_tokens: 2048
    description: 用于简单、快速响应的任务

  # 经济模型 - 用于成本敏感场景
  economical:
    provider: openai
    model: gpt-3.5-turbo
    temperature: 0.3
    max_tokens: 2048
    description: 用于成本敏感的场景

# 模型能力定义（用于动态选择）
capabilities:
  claude-3-opus:
    context_window: 200000
    strengths:
      - complex_reasoning
      - code_generation
      - analysis
    cost_tier: high

  claude-3-5-sonnet:
    context_window: 200000
    strengths:
      - general_tasks
      - code_generation
      - balanced_performance
    cost_tier: medium

  claude-3-haiku:
    context_window: 200000
    strengths:
      - quick_responses
      - simple_tasks
    cost_tier: low

  gpt-4:
    context_window: 8192
    strengths:
      - complex_reasoning
      - analysis
    cost_tier: high

  gpt-4-turbo:
    context_window: 128000
    strengths:
      - long_context
      - complex_reasoning
    cost_tier: high

  gpt-3.5-turbo:
    context_window: 16385
    strengths:
      - simple_tasks
      - cost_effective
    cost_tier: low

# 环境特定覆盖
# 可以通过环境变量或本地配置文件覆盖
overrides:
  # 示例：生产环境使用更经济的模型
  # production:
  #   planner:
  #     profile: balanced
  #   reviewer:
  #     profile: balanced
  #
  # 示例：开发环境使用更快的模型
  # development:
  #   executor:
  #     profile: fast
