# 技能注册表 - 多标签分类系统
# 自动生成于 2026-04-15T09:01:46Z

registry:
  discovery:
    pattern: "**/skill.yaml"
    paths:
      - "integrations/skills/"
    exclude:
      - "**/evolution/**"
      - "**/deprecated/**"
  taxonomy:
    domain:
      - frontend
      - backend
      - fullstack
      - mobile
      - devops
      - ai-ml
      - data
      - security
    technology:
      - react
      - vue
      - angular
      - typescript
      - javascript
      - python
      - go
      - rust
      - java
      - nodejs
      - docker
      - kubernetes
      - aws
      - gcp
      - azure
    task_type:
      - coding
      - review
      - testing
      - debugging
      - refactoring
      - documentation
      - research
      - analysis
      - optimization
    scenario:
      - startup
      - enterprise
      - legacy
      - greenfield
      - maintenance
    complexity:
      - beginner
      - intermediate
      - advanced
      - expert
  relationships:
    hierarchy:
      javascript:
        parent: frontend
      typescript:
        parent: frontend
      react:
        parent: [frontend, javascript]
      vue:
        parent: [frontend, javascript]
    mutually_exclusive:
      - [react, vue, angular]
    recommendations:
      react:
        suggests: [typescript, frontend, coding]
      security:
        suggests: [review, analysis, testing]

