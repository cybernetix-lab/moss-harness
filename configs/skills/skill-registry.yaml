# Skill Registry - Multi-label Classification System
# Auto-generated at 2026-04-08T05:30:00Z

registry:
  # Skill discovery configuration
  discovery:
    # Skill file matching pattern
    pattern: "**/skill.yaml"
    # Scan paths (relative to project root)
    paths:
      - "skills/"
