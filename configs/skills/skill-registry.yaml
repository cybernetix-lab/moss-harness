      - review
      - testing
      - debugging
      - refactoring
      - documentation
      - research
      - analysis
      - optimization

    # Scenario tags
    scenario:
      - startup
      - enterprise
      - legacy
      - greenfield
      - maintenance

    # Complexity tags
    complexity:
      - beginner
      - intermediate
      - advanced
      - expert

  # Tag relationships
  relationships:
    # Tag hierarchy
    hierarchy:
      javascript:
        parent: frontend
      typescript:
        parent: frontend
      react:
        parent: [frontend, javascript]
      vue:
        parent: [frontend, javascript]

    # Mutually exclusive tags
    mutually_exclusive:
      - [react, vue, angular]

    # Tag recommendations
    recommendations:
      react:
        suggests: [typescript, frontend, coding]
      security:
