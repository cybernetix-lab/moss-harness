apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agents.agent-harness.io
spec:
  group: agent-harness.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - agentType
              properties:
                agentType:
                  type: string
                  enum:
                    - planner
                    - reviewer
                    - executor
                    - evaluator
                    - orchestrator
                    - lead
                    - custom
                  description: Type of agent
                name:
                  type: string
                  description: Agent name
                description:
                  type: string
                  description: Agent description
                capabilities:
                  type: array
                  items:
                    type: string
                  description: List of agent capabilities
                config:
                  type: object
                  description: Agent-specific configuration
                  additionalProperties: true
                model:
                  type: object
                  properties:
                    provider:
                      type: string
                    model:
                      type: string
                    temperature:
                      type: number
                    maxTokens:
                      type: integer
                resources:
                  type: object
                  properties:
                    memory:
                      type: string
                      default: 256Mi
                    cpu:
                      type: string
                      default: 250m
                replicas:
                  type: integer
                  default: 1
                  description: Number of agent replicas
                autoScale:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    minReplicas:
                      type: integer
                      default: 1
                    maxReplicas:
                      type: integer
                      default: 5
                    targetCPUUtilization:
                      type: integer
                      default: 80
                memory:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    backend:
                      type: string
                      enum:
                        - redis
                        - postgresql
                        - memory
                      default: redis
                sandbox:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    mode:
                      type: string
                      enum:
                        - docker
                        - kubernetes
                      default: docker
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Failed
                    - Terminated
                replicas:
                  type: integer
                readyReplicas:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.replicas
  scope: Namespaced
  names:
    plural: agents
    singular: agent
    kind: Agent
    shortNames:
      - ag
