apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-harness.fullname" . }}
  labels:
    {{- include "agent-harness.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agent-harness.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agent-harness.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- if .Values.config.telemetry.prometheus.enabled }}
            - name: metrics
              containerPort: {{ .Values.config.telemetry.prometheus.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: AHARNESS_APP_NAME
              value: {{ .Values.config.app.name | quote }}
            - name: AHARNESS_APP_ENV
              value: {{ .Values.config.app.env | quote }}
            - name: AHARNESS_LOG_LEVEL
              value: {{ .Values.config.app.logLevel | quote }}
            - name: AHARNESS_DEFAULT_AGENT
              value: {{ .Values.config.agents.defaultAgent | quote }}
            - name: AHARNESS_MAX_CONCURRENT_TASKS
              value: {{ .Values.config.agents.maxConcurrentTasks | quote }}
            - name: AHARNESS_TASK_TIMEOUT
              value: {{ .Values.config.agents.taskTimeout | quote }}
            - name: AHARNESS_MEMORY_BACKEND
              value: {{ .Values.config.memory.backend | quote }}
            - name: AHARNESS_STORAGE_BACKEND
              value: {{ .Values.config.storage.backend | quote }}
            - name: AHARNESS_SANDBOX_MODE
              value: {{ .Values.config.sandbox.mode | quote }}
            - name: AHARNESS_TELEMETRY_ENABLED
              value: {{ .Values.config.telemetry.enabled | quote }}
            - name: AHARNESS_TELEMETRY_PROMETHEUS_PORT
              value: {{ .Values.config.telemetry.prometheus.port | quote }}
            - name: AHARNESS_MODEL_DEFAULT_PROVIDER
              value: {{ .Values.config.models.defaultProvider | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-harness.fullname" . }}-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-harness.fullname" . }}-secrets
                  key: redis-url
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-harness.fullname" . }}-secrets
                  key: anthropic-api-key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-harness.fullname" . }}-secrets
                  key: openai-api-key
                  optional: true
            - name: FEISHU_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-harness.fullname" . }}-secrets
                  key: feishu-app-id
                  optional: true
            - name: FEISHU_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-harness.fullname" . }}-secrets
                  key: feishu-app-secret
                  optional: true
            - name: FEISHU_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-harness.fullname" . }}-secrets
                  key: feishu-encrypt-key
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "agent-harness.fullname" . }}-config
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
