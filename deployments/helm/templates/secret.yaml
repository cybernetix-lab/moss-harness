apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-harness.fullname" . }}-secrets
  labels:
    {{- include "agent-harness.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "agent-harness.postgresql.connectionString" . | quote }}
  redis-url: {{ include "agent-harness.redis.connectionString" . | quote }}
  {{- if .Values.secrets.modelProviders.anthropic.apiKey }}
  anthropic-api-key: {{ .Values.secrets.modelProviders.anthropic.apiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.modelProviders.openai.apiKey }}
  openai-api-key: {{ .Values.secrets.modelProviders.openai.apiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.feishu.appId }}
  feishu-app-id: {{ .Values.secrets.feishu.appId | quote }}
  {{- end }}
  {{- if .Values.secrets.feishu.appSecret }}
  feishu-app-secret: {{ .Values.secrets.feishu.appSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.feishu.encryptKey }}
  feishu-encrypt-key: {{ .Values.secrets.feishu.encryptKey | quote }}
  {{- end }}
