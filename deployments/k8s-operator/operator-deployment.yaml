apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-harness-operator
  namespace: agent-harness-system
  labels:
    app.kubernetes.io/name: agent-harness-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-harness-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-harness-operator
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: agent-harness-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: operator
          image: agent-harness-operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WATCH_NAMESPACE
              value: ""  # Empty means watch all namespaces
            - name: LEADER_ELECTION_ENABLED
              value: "true"
            - name: LEADER_ELECTION_ID
              value: agent-harness-operator-lock
            - name: LOG_LEVEL
              value: info
            - name: METRICS_BIND_ADDRESS
              value: ":8080"
            - name: HEALTH_PROBE_BIND_ADDRESS
              value: ":8081"
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}
