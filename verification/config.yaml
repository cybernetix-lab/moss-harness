# Verification Configuration

verification:
  # 验证模式
  mode: checkpoint

  # 检查点配置
  checkpoint:
    auto_create: true
    on_success: true
    on_failure: false
    interval_minutes: 15

  # 验证级别
  levels:
    - name: syntax
      description: "语法检查"
      auto: true
      block_on_failure: true
      tools:
        - tsc --noEmit
        - eslint

    - name: static
      description: "静态分析"
      auto: true
      block_on_failure: true
      tools:
        - eslint
        - prettier --check

    - name: unit
      description: "单元测试"
      auto: true
      block_on_failure: true
      min_coverage: 80
      tools:
        - jest
        - vitest

    - name: integration
      description: "集成测试"
      auto: false
      trigger: manual
      tools:
        - playwright
        - cypress

    - name: security
      description: "安全扫描"
      auto: true
      block_on_failure: true
      tools:
        - security-scan
        - dependency-check

    - name: performance
      description: "性能测试"
      auto: false
      trigger: manual
      tools:
        - lighthouse
        - k6

  # 评分器配置
  graders:
    deterministic:
      weight: 0.4
      checks:
        - compilation
        - test_pass_rate
        - coverage

    heuristic:
      weight: 0.3
      checks:
        - code_complexity
        - duplication
        - documentation_coverage

    model_based:
      weight: 0.3
      checks:
        - semantic_correctness
        - completeness
        - best_practices

  # 通过阈值
  thresholds:
    pass_score: 0.8
    excellent_score: 0.95
    max_attempts: 3

  # 失败处理
  on_failure:
    action: pause  # pause | continue | rollback
    notify: true
    create_issue: false

  # 报告配置
  reporting:
    format: markdown
    include:
      - summary
      - detailed_results
      - suggestions
      - metrics
