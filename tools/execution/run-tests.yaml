name: execution_run_tests
description: |
  运行测试套件。支持多种测试框架，自动检测项目类型。
  返回测试结果和覆盖率报告。

input:
  type: object
  properties:
    command:
      type: string
      description: 测试命令（可选，自动检测）

    path:
      type: string
      description: 测试路径
      default: "."

    pattern:
      type: string
      description: 测试文件模式
      default: ""

    coverage:
      type: boolean
      description: 是否生成覆盖率报告
      default: true

    timeout:
      type: integer
      description: 超时时间（秒）
      default: 300

    env:
      type: object
      description: 环境变量
      additionalProperties:
        type: string

  required: []

output:
  type: object
  properties:
    success:
      type: boolean
      description: 是否全部通过

    passed:
      type: integer
      description: 通过测试数

    failed:
      type: integer
      description: 失败测试数

    skipped:
      type: integer
      description: 跳过测试数

    duration_ms:
      type: integer
      description: 执行耗时

    coverage:
      type: object
      description: 覆盖率报告
      properties:
        lines:
          type: number
          description: 行覆盖率
        functions:
          type: number
          description: 函数覆盖率
        branches:
          type: number
          description: 分支覆盖率

    failures:
      type: array
      description: 失败详情
      items:
        type: object
        properties:
          test:
            type: string
            description: 测试名称
          file:
            type: string
            description: 测试文件
          error:
            type: string
            description: 错误信息
          stack:
            type: string
            description: 堆栈跟踪

  required: [success, passed, failed]

errors:
  - name: TestFrameworkNotFoundError
    code: FRAMEWORK_NOT_FOUND
    description: 未找到测试框架

  - name: TestTimeoutError
    code: TIMEOUT
    description: 测试执行超时

  - name: TestCommandFailedError
    code: COMMAND_FAILED
    description: 测试命令执行失败

auto_detection:
  frameworks:
    - name: jest
      indicators: ["jest.config.js", "jest.config.ts"]
      command: "npm test"

    - name: vitest
      indicators: ["vitest.config.ts"]
      command: "npx vitest run"

    - name: pytest
      indicators: ["pytest.ini", "pyproject.toml"]
      command: "pytest"

    - name: cargo
      indicators: ["Cargo.toml"]
      command: "cargo test"

examples:
  - name: 自动检测并运行
    input: {}
    output:
      success: true
      passed: 25
      failed: 0
      skipped: 2
      duration_ms: 5000
      coverage:
        lines: 85.5
        functions: 90.0
        branches: 78.3

  - name: 指定测试文件
    input:
      pattern: "auth.test.ts"
      coverage: false
    output:
      success: false
      passed: 3
      failed: 1
      skipped: 0
      failures:
        - test: "should validate token"
          file: "auth.test.ts"
          error: "expected true, got false"

constraints:
  sandbox: preferred
  max_execution_time_seconds: 600
  blocked_commands:
    - "rm"
    - "sudo"
