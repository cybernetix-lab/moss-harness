name: execution_run_linter
description: |
  运行代码检查工具（Linter）。支持多种语言和检查工具，
  自动检测项目类型并选择合适的 linter。

input:
  type: object
  properties:
    path:
      type: string
      description: 检查路径（文件或目录）
      default: "."
    
    linter:
      type: string
      description: 指定 linter（可选，自动检测）
      enum: [auto, eslint, prettier, flake8, pylint, rubocop, golangci-lint, cargo-clippy]
      default: auto
    
    fix:
      type: boolean
      description: 是否自动修复问题
      default: false
    
    config_path:
      type: string
      description: 自定义配置文件路径
    
    include:
      type: array
      description: 包含的文件模式
      items:
        type: string
      default: []
    
    exclude:
      type: array
      description: 排除的文件模式
      items:
        type: string
      default: ["node_modules", ".git", "dist", "build"]
  
  required: []

output:
  type: object
  properties:
    success:
      type: boolean
      description: 是否通过检查（无错误或严重问题）
    
    linter_used:
      type: string
      description: 实际使用的 linter
    
    files_checked:
      type: integer
      description: 检查的文件数
    
    issues:
      type: array
      description: 发现的问题列表
      items:
        type: object
        properties:
          file:
            type: string
            description: 文件路径
          line:
            type: integer
            description: 行号
          column:
            type: integer
            description: 列号
          severity:
            type: string
            description: 严重程度
            enum: [error, warning, info]
          rule:
            type: string
            description: 规则名称
          message:
            type: string
            description: 问题描述
          fixable:
            type: boolean
            description: 是否可自动修复
    
    summary:
      type: object
      description: 问题汇总
      properties:
        errors:
          type: integer
          description: 错误数
        warnings:
          type: integer
          description: 警告数
        infos:
          type: integer
          description: 信息数
        fixable:
          type: integer
          description: 可自动修复数
    
    duration_ms:
      type: integer
      description: 执行耗时
  
  required: [success, linter_used, files_checked, summary]

auto_detection:
  linters:
    - name: eslint
      indicators: [".eslintrc.js", ".eslintrc.json", ".eslintrc", "eslint.config.js"]
      languages: ["javascript", "typescript"]
      command: "npx eslint"
    
    - name: prettier
      indicators: [".prettierrc", "prettier.config.js"]
      languages: ["javascript", "typescript", "json", "yaml", "markdown"]
      command: "npx prettier --check"
    
    - name: flake8
      indicators: ["setup.cfg", "tox.ini", ".flake8"]
      languages: ["python"]
      command: "flake8"
    
    - name: pylint
      indicators: [".pylintrc", "pyproject.toml"]
      languages: ["python"]
      command: "pylint"
    
    - name: golangci-lint
      indicators: [".golangci.yml", ".golangci.yaml"]
      languages: ["go"]
      command: "golangci-lint run"
    
    - name: cargo-clippy
      indicators: ["Cargo.toml"]
      languages: ["rust"]
      command: "cargo clippy"

errors:
  - name: LinterNotFoundError
    code: LINTER_NOT_FOUND
    description: 未找到合适的 linter
  
  - name: ConfigError
    code: CONFIG_ERROR
    description: 配置文件错误
  
  - name: LinterExecutionError
    code: EXECUTION_ERROR
    description: Linter 执行失败

examples:
  - name: 自动检测并运行
    input:
      path: "./src"
      fix: false
    output:
      success: false
      linter_used: "eslint"
      files_checked: 15
      issues:
        - file: "./src/app.ts"
          line: 42
          column: 5
          severity: error
          rule: "@typescript-eslint/no-unused-vars"
          message: "'x' is defined but never used"
          fixable: true
      summary:
        errors: 2
        warnings: 5
        infos: 0
        fixable: 2
      duration_ms: 1200

constraints:
  max_files: 1000
  timeout_seconds: 120
  fail_on_error: true
