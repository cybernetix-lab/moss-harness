# Mailbox Protocol - 文件邮箱系统协议定义
# 定义 Agent 之间通讯的消息格式、类型和规则

version: "1.0.0"
description: |
  文件邮箱系统协议定义了 Agent 之间通过文件系统进行通讯的标准格式和规则。
  该协议基于 JSON 格式，支持同步和异步消息传递。

# 消息格式定义
message_format:
  schema:
    type: object
    required:
      - header
      - body
      - status
      - created_at

    properties:
      header:
        type: object
        required:
          - id
          - type
          - from
          - to
          - timestamp
          - priority
          - thread_id
        properties:
          id:
            type: string
            pattern: "^msg-[0-9]{8}-[0-9]{6}-[a-f0-9]{8}$"
            description: 消息唯一标识符

          type:
            type: string
            enum:
              # 系统消息
              - TASK_CREATED
              - TASK_CANCELLED
              - TASK_COMPLETED
              - ERROR_OCCURRED
              - SYSTEM_NOTIFICATION

              # 工作流消息
              - PLAN_REQUESTED
              - PLAN_COMPLETED
              - REVIEW_REQUESTED
              - REVIEW_COMPLETED
              - EXECUTION_REQUESTED
              - EXECUTION_COMPLETED
              - EVAL_REQUESTED
              - EVAL_COMPLETED

              # 协作消息
              - CLARIFICATION_REQUESTED
              - CLARIFICATION_PROVIDED
              - FEEDBACK
              - QUESTION
              - ANSWER

              # 状态消息
              - PROGRESS_UPDATE
              - BLOCKED
              - READY
              - BUSY

              # 特殊消息
              - REPLY
              - FORWARDED
              - BROADCAST
            description: 消息类型

          from:
            type: string
            description: 发送方 Agent 名称

          to:
            type: string
            description: 接收方 Agent 名称

          timestamp:
            type: string
            format: date-time
            description: ISO 8601 格式时间戳

          priority:
            type: string
            enum: [low, normal, high, urgent]
            default: normal
            description: 消息优先级

          thread_id:
            type: string
            description: 线程/任务唯一标识符

          in_reply_to:
            type: string
            description: 回复的消息ID（可选）

          forwarded_from:
            type: string
            description: 转发的原始消息ID（可选）

          broadcast:
            type: boolean
            default: false
            description: 是否为广播消息

      body:
        type: object
        description: 消息正文，根据消息类型有不同的结构

      metadata:
        type: object
        properties:
          attempt:
            type: integer
            minimum: 1
            description: 投递尝试次数

          timeout:
            type: integer
            description: 超时时间（秒）

          retry_policy:
            type: string
            enum: [immediate, exponential_backoff, linear_backoff]
            description: 重试策略

          original_message:
            type: string
            description: 原始消息ID（用于回复或转发）

      status:
        type: string
        enum:
          - draft           # 草稿
          - pending_delivery # 待投递
          - sending         # 发送中
          - delivered       # 已送达
          - unread          # 未读
          - read            # 已读
          - processing      # 处理中
          - completed       # 已完成
          - failed          # 失败
          - archived        # 已归档
        description: 消息状态

      created_at:
        type: string
        format: date-time
        description: 创建时间

      sent_at:
        type: string
        format: date-time
        description: 发送时间（可选）

      delivered_at:
        type: string
        format: date-time
        description: 送达时间（可选）

      read_at:
        type: string
        format: date-time
        description: 阅读时间（可选）

      processed_at:
        type: string
        format: date-time
        description: 处理完成时间（可选）

# 消息类型详细定义
message_types:
  # 系统消息
  system:
    TASK_CREATED:
      description: 任务创建通知
      body_schema:
        task_id: string
        requirements: string
        constraints: array
        deadline: string

    TASK_CANCELLED:
      description: 任务取消通知
      body_schema:
        task_id: string
        reason: string

    TASK_COMPLETED:
      description: 任务完成通知
      body_schema:
        task_id: string
        summary: string
        result: object

    ERROR_OCCURRED:
      description: 错误通知
      body_schema:
        error_type: string
        error_message: string
        stack_trace: string
        context: object

  # 工作流消息
  workflow:
    PLAN_REQUESTED:
      description: 请求制定计划
      body_schema:
        task_id: string
        requirements: string
        context: object

    PLAN_COMPLETED:
      description: 计划已完成
      body_schema:
        task_id: string
        execution_plan:
          summary: string
          tasks: array
          risks: array

    REVIEW_REQUESTED:
      description: 请求审查计划
      body_schema:
        task_id: string
        execution_plan: object

    REVIEW_COMPLETED:
      description: 审查已完成
      body_schema:
        task_id: string
        verdict: string
        issues_found: array
        suggestions: array

    EXECUTION_REQUESTED:
      description: 请求执行任务
      body_schema:
        task_id: string
        task: object
        context: object

    EXECUTION_COMPLETED:
      description: 任务执行完成
      body_schema:
        task_id: string
        task_id_completed: string
        code_changes: array
        test_results: object

    EVAL_REQUESTED:
      description: 请求评估
      body_schema:
        task_id: string
        requirements: array
        plan: object
        result: object

    EVAL_COMPLETED:
      description: 评估完成
      body_schema:
        task_id: string
        verdict: string
        requirements_check: array
        test_validation: object
        issues_found: object

  # 协作消息
  collaboration:
    CLARIFICATION_REQUESTED:
      description: 请求澄清
      body_schema:
        question: string
        context: string

    CLARIFICATION_PROVIDED:
      description: 提供澄清
      body_schema:
        answer: string
        examples: array

    FEEDBACK:
      description: 反馈
      body_schema:
        type: string
        content: string
        severity: string

    QUESTION:
      description: 问题
      body_schema:
        question: string
        context: object

    ANSWER:
      description: 回答
      body_schema:
        answer: string
        references: array

# 通讯规则
communication_rules:
  # 投递保证
  delivery_guarantee:
    at_least_once: true
    exactly_once: false
    ordering: causal

  # 重试策略
  retry_policy:
    max_attempts: 3
    initial_delay: 1
    backoff_multiplier: 2
    max_delay: 60

  # 超时设置
  timeout:
    delivery: 30
    processing: 300
    response: 600

  # 优先级处理
  priority:
    urgent:
      delivery_priority: highest
      processing_priority: highest
    high:
      delivery_priority: high
      processing_priority: high
    normal:
      delivery_priority: normal
      processing_priority: normal
    low:
      delivery_priority: low
      processing_priority: low

# 状态转换
state_transitions:
  draft:
    - pending_delivery

  pending_delivery:
    - sending
    - failed

  sending:
    - delivered
    - failed

  delivered:
    - unread

  unread:
    - read

  read:
    - processing
    - completed
    - failed

  processing:
    - completed
    - failed

  completed:
    - archived

  failed:
    - pending_delivery  # 重试
    - archived

# Agent 通讯权限
agent_permissions:
  planner:
    can_send_to: [reviewer, system]
    can_receive_from: [system, reviewer, executor]
    message_types:
      send: [PLAN_COMPLETED, CLARIFICATION_REQUESTED, QUESTION]
      receive: [TASK_CREATED, REVIEW_COMPLETED, CLARIFICATION_PROVIDED, ANSWER]

  reviewer:
    can_send_to: [planner, executor, system]
    can_receive_from: [planner, system]
    message_types:
      send: [REVIEW_COMPLETED, CLARIFICATION_REQUESTED, FEEDBACK]
      receive: [PLAN_COMPLETED, CLARIFICATION_PROVIDED]

  executor:
    can_send_to: [evaluator, planner, system]
    can_receive_from: [reviewer, evaluator, system]
    message_types:
      send: [EXECUTION_COMPLETED, CLARIFICATION_REQUESTED, PROGRESS_UPDATE]
      receive: [EXECUTION_REQUESTED, EVAL_COMPLETED, CLARIFICATION_PROVIDED]

  evaluator:
    can_send_to: [executor, planner, system]
    can_receive_from: [executor, system]
    message_types:
      send: [EVAL_COMPLETED, FEEDBACK]
      receive: [EXECUTION_COMPLETED]

# 邮箱目录结构
mailbox_structure:
  root: runtime/mailbox

  agent_mailbox:
    required_boxes:
      - inbox      # 收件箱
      - outbox     # 发件箱
      - draft      # 草稿箱
      - sent       # 已发送
      - trash      # 回收站
    optional_boxes:
      - archive    # 归档
      - failed     # 失败消息

  shared_space:
    - context     # 共享上下文
    - state       # 全局状态
    - logs        # 通讯日志

# 性能配置
performance:
  max_message_size: 1048576  # 1MB
  max_attachment_size: 10485760  # 10MB
  max_messages_per_box: 1000
  delivery_batch_size: 10
  cleanup_interval: 86400  # 24小时
  retention_days: 30
