name: no-hardcoded-secrets
severity: error
category: security
language: common

description: |
  禁止在代码中硬编码敏感信息。
  敏感信息应该通过环境变量或密钥管理服务提供。

patterns:
  - name: api-key
    pattern: >-
      (api[_-]?key|apikey)\s*[=:]\s*["'][^"']{8,}["']
    message: "检测到可能的 API Key"

  - name: password
    pattern: >-
      (password|passwd|pwd)\s*[=:]\s*["'][^"']+["']
    message: "检测到硬编码密码"

  - name: secret
    pattern: >-
      (secret|private[_-]?key)\s*[=:]\s*["'][^"']+["']
    message: "检测到硬编码密钥"

  - name: token
    pattern: >-
      (token|auth[_-]?token)\s*[=:]\s*["'][^"']{16,}["']
    message: "检测到硬编码 Token"

  - name: private-key
    pattern: "-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
    message: "检测到私钥"

message: |
  检测到硬编码的敏感信息：{{pattern_name}}

  安全风险：
  - 代码泄露导致凭证暴露
  - 难以轮换密钥
  - 违反安全合规要求

fix:
  description: |
    1. 从代码中移除硬编码值
    2. 使用环境变量：process.env.API_KEY
    3. 或使用密钥管理服务（AWS Secrets Manager, HashiCorp Vault）
    4. 更新部署配置以注入密钥

  template: |
    // 使用环境变量
    const apiKey = process.env.API_KEY;
    if (!apiKey) {
      throw new Error('API_KEY environment variable is required');
    }

examples:
  valid:
    - |
      // ✅ 使用环境变量
      const apiKey = process.env.API_KEY;

      // ✅ 使用配置服务
      const config = await secretsManager.getSecret('api-key');

  invalid:
    - |
      // ❌ 硬编码 API Key
      const API_KEY = "sk-1234567890abcdef";
    - |
      // ❌ 硬编码密码
      const password = "mySecretPassword123";
    - |
      // ❌ 嵌入私钥
      const privateKey = `-----BEGIN RSA PRIVATE KEY-----
      MIIEpAIBAAKCAQEA...
      -----END RSA PRIVATE KEY-----`;

exceptions:
  - condition: "测试/模拟数据"
    reason: "测试可以使用假数据"
    requirement: "文件名必须包含 .test. 或 .mock."
  - condition: "示例代码"
    reason: "文档示例可以使用占位符"
    requirement: "必须使用明显的占位符如 YOUR_API_KEY"
