# Telemetry Configuration

collection:
  # 启用/禁用
  enabled: true
  
  # 采样率 (1.0 = 100%)
  sample_rate: 1.0
  
  # 收集的数据类型
  data_types:
    traces: true
    metrics: true
    logs: true
    checkpoints: true

storage:
  # 存储后端
  backend: local
  
  # 本地存储配置
  local:
    path: ./runtime/telemetry
    max_size_mb: 1000
    retention_days: 30

  # 旋转策略
  rotation:
    max_file_size_mb: 100
    max_files: 10

traces:
  # 追踪配置
  capture:
    input: true
    output: true
    stack_trace: true
    context_snapshot: true
  
  # 敏感数据过滤
  redaction:
    patterns:
      - "password"
      - "token"
      - "secret"
      - "api_key"
    replacement: "[REDACTED]"

metrics:
  # 指标收集
  collect:
    - operation_count
    - operation_duration
    - error_rate
    - context_size
    - token_usage
  
  # 聚合间隔
  aggregation_interval_seconds: 60

# Token 消耗观测配置（基于信息论）
token_telemetry:
  import: ./token-telemetry.yaml
  
  # 信息论优化指标
  information_theory_metrics:
    enabled: true
    metrics:
      - information_entropy        # 信息熵
      - token_information_density  # Token 信息密度
      - signal_to_noise_ratio      # 信噪比
      - compression_ratio          # 压缩率
      
  # 成本追踪
  cost_tracking:
    enabled: true
    models:
      - name: claude-3-opus
        input_price_per_1k: 15.0    # USD
        output_price_per_1k: 75.0   # USD
      - name: claude-3-5-sonnet
        input_price_per_1k: 3.0     # USD
        output_price_per_1k: 15.0   # USD
      - name: gpt-4
        input_price_per_1k: 30.0    # USD
        output_price_per_1k: 60.0   # USD
      - name: gpt-3.5-turbo
        input_price_per_1k: 0.5     # USD
        output_price_per_1k: 1.5    # USD
        
  # 预算管理
  budget_management:
    enabled: true
    default_budget_per_task: 10000  # tokens
    alert_threshold_percent: 80
    hard_limit_percent: 95

checkpoints:
  # 自动检查点
  auto_create:
    on_success: true
    on_error: true
    interval_minutes: 10
  
  # 保留策略
  retention:
    max_checkpoints: 50
    min_interval_minutes: 5
