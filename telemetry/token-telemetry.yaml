# Token 消耗 Telemetry 配置
# 基于信息论原理的 Token 使用观测

# ==================== 采集维度 ====================
dimensions:
  - agent_type        # Agent 类型（planner/executor等）
  - operation_type    # 操作类型（plan/execute/evaluate）
  - model_name        # 模型名称

# ==================== 可采集指标 ====================
metrics:
  # 基础指标 - 可直接从模型 API 获取
  - name: token_input_count
    description: 输入 Token 数量
    type: counter
    source: model_api
    
  - name: token_output_count
    description: 输出 Token 数量
    type: counter
    source: model_api
    
  - name: token_total_count
    description: 总 Token 消耗
    type: counter
    source: calculated  # input + output

  # 信息论指标 - 基于文本计算
  - name: information_entropy
    description: 文本信息熵（基于字符分布）
    type: gauge
    unit: bits
    source: calculated
    formula: "-sum(p(x) * log2(p(x)))"
    
  - name: token_information_density
    description: 信息密度（信息熵/Token数）
    type: gauge
    unit: bits/token
    source: calculated

  # 效率指标
  - name: tokens_per_task
    description: 每个任务的平均 Token 消耗
    type: histogram
    buckets: [1000, 5000, 10000, 50000]
    
  - name: token_utilization_rate
    description: Token 利用率（实际使用/预算上限）
    type: gauge
    unit: percent

# ==================== 成本计算 ====================
cost_models:
  - name: claude-3-opus
    input_price_per_1k: 15.0
    output_price_per_1k: 75.0
    
  - name: claude-3-5-sonnet
    input_price_per_1k: 3.0
    output_price_per_1k: 15.0
    
  - name: gpt-4
    input_price_per_1k: 30.0
    output_price_per_1k: 60.0
